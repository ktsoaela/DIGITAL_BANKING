services:
  banka-web:
    build: ./services/web
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-only-change-me
    ports:
      - "8000:8000"
    volumes:
      - web_data:/app/data
    depends_on:
      banka-api:
        condition: service_healthy
      digital-banking-api:
        condition: service_healthy
      khoebo-api:
        condition: service_healthy

  banka-api:
    build: ./services/banka-api
    ports:
      - "8001:8000"
    volumes:
      - banka_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  digital-banking-api:
    build: ./services/atm-api
    ports:
      - "8002:8000"
    volumes:
      - atm_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  khoebo-api:
    build: ./services/trading-api
    ports:
      - "8003:8000"
    volumes:
      - trading_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  web_data:
  banka_data:
  atm_data:
  trading_data:
